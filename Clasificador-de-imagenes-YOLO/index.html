<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detector de Ropa YOLO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background-color: #222; color: white; }
        
        .canvas-wrapper {
            position: relative;
            margin: 0 auto;
            width: 640px;
            max-width: 100%;
            border: 4px solid #00ff00; /* Borde verde para ver que el contenedor existe */
            border-radius: 8px;
            overflow: hidden;
            background-color: #333; /* Fondo gris si no carga video */
        }

        canvas { 
            display: block; 
            width: 100%; 
        }

        #video { display: none; } 
    </style>
  </head>
  <body>
    <main class="text-center mt-4">
      <h1 class="display-6 fw-bold">Detector de Ropa</h1>
      <p class="lead text-white-50">Jostin</p>

      <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>

      <div id="resultado" class="mt-3 fs-4 fw-bold text-warning">
        Iniciando...
      </div>
      
      <video id="video" playsinline muted></video>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script>
      const MODEL_PATH = 'Model/model.json'; 
      const CLASES = ['Sueter', 'Camiseta', 'Buso']; 
      const UMBRAL = 0.40;

      const VIDEO_ID = 'video';
      const CANVAS_ID = 'canvas';
      const RESULTADO_ID = 'resultado';

      let model;
      let video;
      let canvas;
      let ctx;
      let isDetecting = false;

      async function init() {
          const info = document.getElementById(RESULTADO_ID);
          try {
              info.innerHTML = "Cargando Cerebro...";
              model = await tf.loadGraphModel(MODEL_PATH);
              
              info.innerHTML = "Encendiendo cámara...";
              await setupCamera();
              
              info.innerHTML = "Apunta a la ropa";
              info.className = "mt-3 fs-4 fw-bold text-success";
              
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              
              detectFrame();

          } catch (e) {
              console.error(e);
              info.innerHTML = `Error: ${e.message}`;
              alert("Error: Revisa la consola (F12).");
          }
      }

      async function setupCamera() {
          video = document.getElementById(VIDEO_ID);
          canvas = document.getElementById(CANVAS_ID);
          ctx = canvas.getContext('2d');

          const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: 640, height: 480 }, 
              audio: false
          });
          
          video.srcObject = stream;
          
          return new Promise((resolve) => {
              video.onloadedmetadata = () => {
                  video.play();
                  resolve(video);
              };
          });
      }

      async function detectFrame() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
               if (!isDetecting) {
                   runDetection();
               }
          }
          requestAnimationFrame(detectFrame);
      }

      async function runDetection() {
          isDetecting = true;
          const tfImg = tf.tidy(() => {
              const img = tf.browser.fromPixels(video);
              const resized = tf.image.resizeBilinear(img, [640, 640]);
              const normalized = resized.div(255.0);
              return normalized.expandDims(0);
          });

          try {
              const res = await model.executeAsync(tfImg);
              await processOutput(res); // Dibujamos
              tf.dispose(res);
          } catch (error) {
              console.error(error);
          } finally {
              tf.dispose(tfImg);
              isDetecting = false;
          }
      }

      async function processOutput(res) {
          const trans = res.transpose([0, 2, 1]);
          const data = await trans.data();
          tf.dispose(trans);

          // 1. Limpiar canvas y dibujar video
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const scaleX = canvas.width / 640;
          const scaleY = canvas.height / 640;

          // Variables para guardar SOLO LA MEJOR predicción
          let mejorScore = 0;
          let mejorCaja = null;
          let mejorClase = -1;

          // 2. Buscar la mejor caja de todas
          for (let i = 0; i < 8400; i++) {
              const row = i * (4 + CLASES.length);
              
              let maxScore = 0;
              let maxClass = -1;

              for (let j = 0; j < CLASES.length; j++) {
                  const score = data[row + 4 + j];
                  if (score > maxScore) {
                      maxScore = score;
                      maxClass = j;
                  }
              }

              if (maxScore > UMBRAL && maxScore > mejorScore) {
                  mejorScore = maxScore;
                  mejorClase = maxClass;
                  const x = data[row];
                  const y = data[row + 1];
                  const w = data[row + 2];
                  const h = data[row + 3];
                  
                  mejorCaja = [x, y, w, h];
              }
          }

          // 3. Dibujar SOLO la ganadora (si hubo alguna)
          const info = document.getElementById(RESULTADO_ID);
          
          if (mejorCaja) {
              const [x, y, w, h] = mejorCaja;
              const boxX = (x - w/2) * scaleX;
              const boxY = (y - h/2) * scaleY;
              const boxW = w * scaleX;
              const boxH = h * scaleY;

              // Elegir color
              const color = mejorClase === 0 ? '#FF0000' : (mejorClase === 1 ? '#00FF00' : '#0055FF');
              const nombre = CLASES[mejorClase];
              const conf = Math.round(mejorScore * 100);

              // Actualizar texto de abajo
              info.innerHTML = `¡ES UN ${nombre.toUpperCase()}! (${conf}%)`;
              info.style.color = color;

              // Dibujar Rectángulo
              ctx.lineWidth = 5;
              ctx.strokeStyle = color;
              ctx.strokeRect(boxX, boxY, boxW, boxH);

              // Dibujar Texto
              ctx.font = 'bold 24px Arial';
              ctx.fillStyle = color;
              
              // Si la caja está muy arriba, dibujamos el texto ADENTRO, no arriba
              let textoY = boxY - 10;
              if (textoY < 30) { textoY = boxY + 30; } // Ajuste anti-desborde

              ctx.fillText(`${nombre} ${conf}%`, boxX + 5, textoY);
          } else {
              info.innerHTML = "Buscando ropa...";
              info.style.color = "white";
          }
      }

      init();
    </script>
  </body>
</html>
